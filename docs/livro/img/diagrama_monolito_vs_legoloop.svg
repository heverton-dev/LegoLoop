<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .main-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; }
      .main-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748b; }
      .card-left { fill: #ffffff; stroke: #fca5a5; stroke-width: 1.5; rx: 8px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
      .card-right { fill: #ffffff; stroke: #93c5fd; stroke-width: 1.5; rx: 8px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
      .box-head-left { fill: #fef2f2; stroke: #f87171; stroke-width: 1; rx: 6px; }
      .box-head-right { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1; rx: 6px; }
      .head-title-left { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; fill: #b91c1c; }
      .head-title-right { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; fill: #1d4ed8; }
      .token-badge-left { font-family: system-ui, -apple-system, monospace; font-size: 10.5px; font-weight: 700; fill: #b91c1c; text-anchor: middle; }
      .token-badge-right { font-family: system-ui, -apple-system, monospace; font-size: 10.5px; font-weight: 700; fill: #1d4ed8; text-anchor: middle; }
      .item-box { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 6px; }
      .item-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; fill: #1e293b; }
      .item-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #64748b; }
      .fail-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #dc2626; }
      .pill-fail { fill: #fee2e2; stroke: #ef4444; stroke-width: 1; rx: 4px; }
      .pill-ok { fill: #dcfce7; stroke: #22c55e; stroke-width: 1; rx: 4px; }
      .pill-text-fail { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #b91c1c; text-anchor: middle; }
      .pill-text-ok { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #15803d; text-anchor: middle; }
      .step-num { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
      .step-arrow { stroke: #2563eb; stroke-width: 2; fill: none; }
    </style>
    <marker id="blue-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Fundo Limpo com Borda -->
  <rect width="900" height="480" class="bg" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Cabeçalho Principal do Gráfico com Alto Contraste -->
  <text x="450" y="38" text-anchor="middle" class="main-title">PARADIGMA AGÊNTICO: MONÓLITO vs. ESTEIRA MODULAR</text>
  <text x="450" y="58" text-anchor="middle" class="main-sub">Como o fatiamento cirúrgico elimina o inchaço de contexto e as alucinações</text>

  <!-- ==================== LADO ESQUERDO: O MONÓLITO TRADICIONAL ==================== -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="390" height="370" class="card-left" />
    
    <!-- Topo do Card -->
    <rect x="12" y="12" width="366" height="38" class="box-head-left" />
    <circle cx="28" cy="31" r="5" fill="#dc2626"/>
    <text x="40" y="35" class="head-title-left">CHAT MONOLÍTICO</text>
    <rect x="250" y="21" width="118" height="20" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="309" y="35" class="token-badge-left" text-anchor="middle">~150.000 TOKENS</text>

    <!-- Itens Empilhados -->
    <g transform="translate(14, 62)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="362" height="56" class="item-box" />
      <text x="12" y="22" class="item-title">Catálogo Eager (677 Ferramentas Carregadas)</text>
      <text x="12" y="42" class="fail-text">• 63.000 tokens despejados no prompt antes do "olá"</text>

      <!-- Item 2 -->
      <rect x="0" y="66" width="362" height="56" class="item-box" />
      <text x="12" y="88" class="item-title">Esquemas de MCPs Despejados na Inicialização</text>
      <text x="12" y="108" class="fail-text">• 40.000 tokens de JSON Schema sem uso imediato</text>

      <!-- Item 3 -->
      <rect x="0" y="132" width="362" height="84" class="item-box" />
      <text x="12" y="154" class="item-title">Histórico Poluído (50 turnos de conversa)</text>
      <text x="12" y="174" class="item-desc">Respostas antigas esquecidas e tentativas descartadas</text>
      <text x="12" y="196" class="fail-text">• Atenção do modelo diluída (Alucinações frequentes)</text>

      <!-- Badges de Consequência -->
      <g transform="translate(0, 230)">
        <rect x="0" y="0" width="112" height="28" class="pill-fail" />
        <text x="56" y="18" class="pill-text-fail">LENTIDÃO</text>

        <rect x="125" y="0" width="112" height="28" class="pill-fail" />
        <text x="181" y="18" class="pill-text-fail">CUSTO ALTO</text>

        <rect x="250" y="0" width="112" height="28" class="pill-fail" />
        <text x="306" y="18" class="pill-text-fail">ALUCINAÇÃO</text>
      </g>
    </g>
  </g>

  <!-- ==================== LADO DIREITO: ESTEIRA MODULAR LEGOLOOP ==================== -->
  <g transform="translate(470, 80)">
    <rect x="0" y="0" width="390" height="370" class="card-right" />
    
    <!-- Topo do Card -->
    <rect x="12" y="12" width="366" height="38" class="box-head-right" />
    <circle cx="28" cy="31" r="5" fill="#2563eb"/>
    <text x="40" y="35" class="head-title-right">ESTEIRA MODULAR</text>
    <rect x="240" y="21" width="128" height="20" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
    <text x="304" y="35" class="token-badge-right" text-anchor="middle">2k A 5k TOKENS/NÓ</text>

    <!-- Nós da Esteira -->
    <g transform="translate(14, 62)">
      <!-- Nó 1 -->
      <rect x="0" y="0" width="362" height="56" class="item-box" stroke="#bfdbfe" />
      <circle cx="24" cy="28" r="12" fill="#2563eb"/>
      <text x="24" y="32" class="step-num">01</text>
      <text x="48" y="22" class="item-title">Nó 1: Concepção (Entrevista Socrática)</text>
      <text x="48" y="42" class="item-desc">Contexto estéril • Produz INTENT.md • Mata a sessão</text>

      <!-- Seta 1 -->
      <line x1="181" y1="56" x2="181" y2="66" class="step-arrow" marker-end="url(#blue-arr)"/>

      <!-- Nó 2 -->
      <rect x="0" y="70" width="362" height="56" class="item-box" stroke="#bfdbfe" />
      <circle cx="24" cy="98" r="12" fill="#d97706"/>
      <text x="24" y="102" class="step-num">02</text>
      <text x="48" y="92" class="item-title">Nó 2: Especificação &amp; Critérios Binários</text>
      <text x="48" y="112" class="item-desc">Lê apenas INTENT.md • Produz SPEC.md • Gate Automático</text>

      <!-- Seta 2 -->
      <line x1="181" y1="126" x2="181" y2="136" class="step-arrow" marker-end="url(#blue-arr)"/>

      <!-- Nó 3 -->
      <rect x="0" y="140" width="362" height="56" class="item-box" stroke="#bfdbfe" />
      <circle cx="24" cy="168" r="12" fill="#16a34a"/>
      <text x="24" y="172" class="step-num">03</text>
      <text x="48" y="162" class="item-title">Nó 3: Execução TDD (Red-Green-Refactor)</text>
      <text x="48" y="182" class="item-desc">Zero stubs • Lazy MCP sob demanda • Stop-Gate Humano</text>

      <!-- Badges de Benefício -->
      <g transform="translate(0, 230)">
        <rect x="0" y="0" width="112" height="28" class="pill-ok" />
        <text x="56" y="18" class="pill-text-ok">VELOCIDADE</text>

        <rect x="125" y="0" width="112" height="28" class="pill-ok" />
        <text x="181" y="18" class="pill-text-ok">95% ECONOMIA</text>

        <rect x="250" y="0" width="112" height="28" class="pill-ok" />
        <text x="306" y="18" class="pill-text-ok">DETERMINISMO</text>
      </g>
    </g>
  </g>
</svg>