<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; fill: #64748b; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; }
      .sublabel { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #64748b; }
    </style>
  </defs>

  <rect width="880" height="380" class="bg" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="35" y="38" class="title">Sonorização Sincronizada (Ducking -18dB) &amp; Entrega Híbrida</text>
  <text x="35" y="60" class="subtitle">O SFX atinge o pico na parada do gráfico; a entrega bifurca em render rápido e timeline aberta</text>

  <!-- LADO ESQUERDO: DUCKING E SFX -->
  <g transform="translate(35, 90)">
    <rect width="400" height="250" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
    <text x="20" y="30" class="label" fill="#2563eb">1. Curva de Ducking e Alinhamento de SFX</text>

    <!-- Nível Normal da Trilha (0dB) -->
    <text x="20" y="70" class="sublabel" fill="#64748b">Trilha (0dB)</text>
    <line x1="90" y1="65" x2="160" y2="65" stroke="#3b82f6" stroke-width="2.5"/>

    <!-- Queda de Ducking (-18dB) durante a fala -->
    <path d="M 160 65 C 180 65 190 120 210 120 L 320 120 C 340 120 350 65 370 65" stroke="#3b82f6" stroke-width="2.5" fill="none"/>
    <text x="20" y="125" class="sublabel" fill="#dc2626">Ducking (-18dB)</text>

    <!-- Barra de Voz -->
    <rect x="200" y="80" width="130" height="25" fill="#fef08a" stroke="#ca8a04" rx="4"/>
    <text x="265" y="97" font-family="system-ui" font-size="10" font-weight="700" fill="#854d0e" text-anchor="middle">VOZ ATIVA DO LOCUTOR</text>

    <!-- Pico de SFX (Whoosh) alinhado ao frame exato -->
    <path d="M 150 160 L 175 160 Q 185 130 190 130 Q 195 130 205 160 L 230 160" stroke="#7c3aed" stroke-width="2.5" fill="none"/>
    <line x1="190" y1="125" x2="190" y2="185" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="190" y="200" font-family="system-ui" font-size="9.5" font-weight="700" fill="#7c3aed" text-anchor="middle">PICO DE WHOOSH NO FRAME DA PARADA</text>

    <text x="20" y="235" class="sublabel" fill="#334155">• Evita que a música compita com frequências médias da voz humana</text>
  </g>

  <!-- LADO DIREITO: ENTREGA HÍBRIDA -->
  <g transform="translate(455, 90)">
    <rect width="390" height="250" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" rx="8"/>
    <text x="20" y="30" class="label" fill="#16a34a">2. Saída Dupla: Imediata e Profissional</text>

    <!-- Saída A: MP4 Broadcast -->
    <g transform="translate(20, 55)">
      <rect width="350" height="70" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="16" y="26" class="label" fill="#0f172a">dist/render_final.mp4 (H.264/AAC)</text>
      <text x="16" y="44" class="sublabel" fill="#64748b">• Render achatado imediato para preview ou postagem rápida</text>
      <text x="16" y="58" class="sublabel" fill="#64748b">• Renderizado 100% via FFmpeg/NVENC local em 1080p60</text>
    </g>

    <!-- Saída B: FCPXML Aberta -->
    <g transform="translate(20, 140)">
      <rect width="350" height="85" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <text x="16" y="26" class="label" fill="#15803d">dist/timeline.fcpxml (Linha do Tempo Aberta)</text>
      <text x="16" y="44" class="sublabel" fill="#166534">• Abre no DaVinci Resolve, Final Cut e Premiere Pro</text>
      <text x="16" y="58" class="sublabel" fill="#166534">• Cortes originais com sobras (handles) para ajuste milimétrico</text>
      <text x="16" y="72" class="sublabel" fill="#166534">• Pistas separadas de Voz, Trilha, SFX e Gráficos alfa</text>
    </g>
  </g>
</svg>
