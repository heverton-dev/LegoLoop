<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; fill: #64748b; }
      .wave { stroke: #3b82f6; stroke-width: 2; fill: none; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; }
      .sublabel { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #64748b; }
    </style>
  </defs>

  <rect width="880" height="380" class="bg" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="35" y="38" class="title">Anatomia do Corte: Folga Pré-Fala (+40ms) &amp; Extirpação de Notas</text>
  <text x="35" y="60" class="subtitle">Como o algoritmo protege o ataque fonético das consoantes e elimina falas de bastidores</text>

  <!-- PAINEL 1: FOLGA +40MS -->
  <g transform="translate(35, 90)">
    <rect width="400" height="250" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
    <text x="20" y="30" class="label" fill="#2563eb">1. O Ataque Fonético e a Margem +40ms</text>
    
    <!-- Linha base de áudio -->
    <line x1="20" y1="120" x2="380" y2="120" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    
    <!-- Onda Sonora Simula Silêncio -> Ataque -> Fala -->
    <path d="M 20 120 L 100 120 Q 110 119 120 120 Q 130 118 140 120 L 170 120 Q 185 85 200 120 Q 215 155 230 120 Q 245 70 260 120 Q 275 160 290 120 Q 305 90 320 120 L 380 120" class="wave"/>

    <!-- Ponto VAD tradicional (corte seco) -->
    <line x1="185" y1="65" x2="185" y2="175" stroke="#dc2626" stroke-width="2"/>
    <text x="185" y="60" class="sublabel" fill="#dc2626" text-anchor="middle">VAD Sem Folga (Corta a letra 'P')</text>

    <!-- Zona +40ms (Margem Dourada) -->
    <rect x="135" y="80" width="50" height="80" fill="#22c55e" fill-opacity="0.2" stroke="#16a34a" stroke-dasharray="2 2"/>
    <line x1="135" y1="65" x2="135" y2="175" stroke="#16a34a" stroke-width="2.5"/>
    <text x="135" y="60" class="sublabel" fill="#16a34a" text-anchor="middle">Corte Real (+40ms)</text>

    <text x="20" y="205" class="sublabel" fill="#334155">• Consoantes plosivas (/p/, /t/, /k/) geram pressão antes do limiar</text>
    <text x="20" y="225" class="sublabel" fill="#334155">• A folga constante de 40ms preserva a respiração e a dicção natural</text>
  </g>

  <!-- PAINEL 2: EXTIRPAÇÃO DE NOTAS -->
  <g transform="translate(455, 90)">
    <rect width="390" height="250" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" rx="8"/>
    <text x="20" y="30" class="label" fill="#7c3aed">2. Filtro de Extirpação de Notas de Edição</text>

    <!-- Sentença Boa 1 -->
    <rect x="20" y="55" width="350" height="35" rx="5" fill="#f0fdf4" stroke="#86efac"/>
    <text x="30" y="77" font-family="system-ui" font-size="11" fill="#166534">"O principal benefício de usar IA na edição..."</text>

    <!-- Bloco Nota de Edição (Expurgado) -->
    <rect x="20" y="100" width="350" height="48" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="4 2"/>
    <text x="30" y="120" font-family="system-ui" font-size="10.5" font-weight="700" fill="#991b1b">⚠️ [NOTA DE EDIÇÃO FALADA: EXPURGO TOTAL]</text>
    <text x="30" y="138" font-family="system-ui" font-size="10" fill="#b91c1c">"Nota de edição: adicionar zoom aqui no segundo argumento... fim"</text>

    <!-- Sentença Boa 2 -->
    <rect x="20" y="158" width="350" height="35" rx="5" fill="#f0fdf4" stroke="#86efac"/>
    <text x="30" y="180" font-family="system-ui" font-size="11" fill="#166534">"...é a reprodutibilidade determinística do processo."</text>

    <text x="20" y="220" class="sublabel" fill="#334155">Resultado: As duas sentenças úteis são fundidas na timeline sem vestígios</text>
  </g>
</svg>
