<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748b; }
      .node-card { fill: #ffffff; stroke-width: 1.5; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05)); rx: 10px; }
      .node-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
      .node-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .badge { font-family: system-ui, -apple-system, monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .flow-arrow { stroke: #94a3b8; stroke-width: 2.5; fill: none; }
      .gate-pill { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; rx: 12px; }
      .gate-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #dc2626; text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
  </defs>

  <rect width="880" height="440" class="bg" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="40" y="42" class="title">A Tríade Canônica da Fabricação Autônoma</text>
  <text x="40" y="64" class="subtitle">Como o LegoLoop transforma um desejo em linguagem natural numa esteira matemática determinística</text>

  <!-- Estágio 1: INTENT -->
  <g transform="translate(40, 110)">
    <rect width="175" height="180" class="node-card" stroke="#2563eb" />
    <rect x="0" y="0" width="175" height="6" fill="#2563eb" rx="3" />
    <text x="16" y="32" class="node-title" fill="#2563eb">1. INTENT</text>
    <text x="16" y="52" class="node-desc">Intenção Pura</text>
    <line x1="16" y1="62" x2="159" y2="62" stroke="#e2e8f0" />
    <text x="16" y="82" class="node-desc">Entrevista Socrática</text>
    <text x="16" y="102" class="node-desc">Resolução de premissas</text>
    <text x="16" y="122" class="node-desc">Objetivo de negócio</text>
    <text x="16" y="142" class="node-desc">Escopo inegociável</text>
    <rect x="16" y="152" width="143" height="20" fill="#eff6ff" rx="4" />
    <text x="87" y="166" class="badge" fill="#2563eb">INTENT.md</text>
  </g>

  <!-- Flecha 1 com Gate -->
  <path d="M 215 200 L 255 200" class="flow-arrow" marker-end="url(#arrow)" />

  <!-- Estágio 2: SPEC -->
  <g transform="translate(260, 110)">
    <rect width="175" height="180" class="node-card" stroke="#16a34a" />
    <rect x="0" y="0" width="175" height="6" fill="#16a34a" rx="3" />
    <text x="16" y="32" class="node-title" fill="#16a34a">2. SPEC</text>
    <text x="16" y="52" class="node-desc">Especificação</text>
    <line x1="16" y1="62" x2="159" y2="62" stroke="#e2e8f0" />
    <text x="16" y="82" class="node-desc">Critérios binários</text>
    <text x="16" y="102" class="node-desc">Entradas e saídas</text>
    <text x="16" y="122" class="node-desc">Leis invioláveis</text>
    <text x="16" y="142" class="node-desc">Casos de borda</text>
    <rect x="16" y="152" width="143" height="20" fill="#f0fdf4" rx="4" />
    <text x="87" y="166" class="badge" fill="#16a34a">SPEC.md</text>
  </g>

  <!-- Flecha 2 -->
  <path d="M 435 200 L 475 200" class="flow-arrow" marker-end="url(#arrow)" />

  <!-- Estágio 3: PLAN -->
  <g transform="translate(480, 110)">
    <rect width="175" height="180" class="node-card" stroke="#d97706" />
    <rect x="0" y="0" width="175" height="6" fill="#d97706" rx="3" />
    <text x="16" y="32" class="node-title" fill="#d97706">3. PLAN</text>
    <text x="16" y="52" class="node-desc">Plano de Tickets</text>
    <line x1="16" y1="62" x2="159" y2="62" stroke="#e2e8f0" />
    <text x="16" y="82" class="node-desc">Micro-tarefas em TDD</text>
    <text x="16" y="102" class="node-desc">Testes Red-Green</text>
    <text x="16" y="122" class="node-desc">Passos atômicos</text>
    <text x="16" y="142" class="node-desc">Stop-gates humanos</text>
    <rect x="16" y="152" width="143" height="20" fill="#fffbeb" rx="4" />
    <text x="87" y="166" class="badge" fill="#d97706">PLAN.md</text>
  </g>

  <!-- Flecha 3 -->
  <path d="M 655 200 L 695 200" class="flow-arrow" marker-end="url(#arrow)" />

  <!-- Estágio 4: ROUTE -->
  <g transform="translate(700, 110)">
    <rect width="155" height="180" class="node-card" stroke="#0f172a" />
    <rect x="0" y="0" width="155" height="6" fill="#0f172a" rx="3" />
    <text x="16" y="32" class="node-title" fill="#0f172a">4. ROUTE</text>
    <text x="16" y="52" class="node-desc">Grafo Acíclico (DAG)</text>
    <line x1="16" y1="62" x2="139" y2="62" stroke="#e2e8f0" />
    <text x="16" y="82" class="node-desc">Orchestrix estéril</text>
    <text x="16" y="102" class="node-desc">Topologia de nós</text>
    <text x="16" y="122" class="node-desc">Execução cirúrgica</text>
    <text x="16" y="142" class="node-desc">0% vazamento</text>
    <rect x="16" y="152" width="123" height="20" fill="#f1f5f9" rx="4" />
    <text x="77" y="166" class="badge" fill="#0f172a">ROUTE.json</text>
  </g>

  <!-- Banner Inferior de Blindagem -->
  <g transform="translate(40, 320)">
    <rect width="815" height="75" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" />
    <text x="24" y="30" class="node-title" fill="#0f172a">Blindagem contra Alucinações:</text>
    <text x="24" y="52" class="node-desc">Cada artefato gerado é validado matematicamente contra seu esquema JSON e leis de governança antes do próximo nó ser disparado.</text>
    <circle cx="760" cy="37" r="18" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <path d="M 752 37 L 758 43 L 770 30" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>