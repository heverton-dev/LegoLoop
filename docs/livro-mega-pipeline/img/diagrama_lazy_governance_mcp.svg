<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748b; }
      .side-card { fill: #ffffff; stroke-width: 1.5; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05)); rx: 10px; }
      .side-title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
      .badge-fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 1; rx: 4px; }
      .badge-success { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1; rx: 4px; }
      .badge-text-fail { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #dc2626; }
      .badge-text-success { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #16a34a; }
      .item-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .stat-number { font-family: system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: 800; }
      .stat-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
    </style>
  </defs>

  <rect width="880" height="440" class="bg" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="40" y="42" class="title">Governança Lazy Universal de MCPs: O Fim do Desperdício</text>
  <text x="40" y="64" class="subtitle">Como o Meta-MCP Router do LegoLoop reduz o consumo inicial de tokens em até 95% sem perder recursos</text>

  <!-- Lado Esquerdo: Abordagem Tradicional Eager -->
  <g transform="translate(40, 95)">
    <rect width="385" height="310" class="side-card" stroke="#fca5a5" />
    <rect x="0" y="0" width="385" height="8" fill="#dc2626" rx="4" />
    <text x="24" y="36" class="side-title" fill="#dc2626">Abordagem Convencional (Eager)</text>
    
    <rect x="24" y="48" width="120" height="20" class="badge-fail" />
    <text x="32" y="62" class="badge-text-fail">ALTO DESPERDÍCIO</text>

    <!-- Stat -->
    <text x="24" y="112" class="stat-number" fill="#dc2626">~120.000</text>
    <text x="24" y="128" class="stat-desc">Tokens gastos na inicialização do prompt</text>

    <line x1="24" y1="145" x2="360" y2="145" stroke="#f1f5f9" stroke-width="1.5" />

    <text x="24" y="172" class="item-text">• Todas as 200+ ferramentas injetadas no início</text>
    <text x="24" y="196" class="item-text">• Modelos esgotam a memória antes do primeiro "olá"</text>
    <text x="24" y="220" class="item-text">• LLM se perde com descrições excessivas de ferramentas</text>
    <text x="24" y="244" class="item-text">• Lentidão extrema e alta latência nas respostas</text>
    <text x="24" y="268" class="item-text">• Cada turno da conversa recarrega o catálogo inteiro</text>
  </g>

  <!-- Lado Direito: LegoLoop Lazy Router -->
  <g transform="translate(455, 95)">
    <rect width="385" height="310" class="side-card" stroke="#86efac" />
    <rect x="0" y="0" width="385" height="8" fill="#16a34a" rx="4" />
    <text x="24" y="36" class="side-title" fill="#16a34a">LegoLoop Meta-MCP (Lazy Router)</text>
    
    <rect x="24" y="48" width="125" height="20" class="badge-success" />
    <text x="32" y="62" class="badge-text-success">95% DE ECONOMIA</text>

    <!-- Stat -->
    <text x="24" y="112" class="stat-number" fill="#16a34a">~800</text>
    <text x="24" y="128" class="stat-desc">Tokens iniciais com Meta-Router ativado</text>

    <line x1="24" y1="145" x2="360" y2="145" stroke="#f1f5f9" stroke-width="1.5" />

    <text x="24" y="172" class="item-text">• Apenas 2 ferramentas iniciais (search e call)</text>
    <text x="24" y="196" class="item-text">• Descoberta semântica inteligente sob demanda</text>
    <text x="24" y="220" class="item-text">• Modelo atua com clareza cristalina e foco cirúrgico</text>
    <text x="24" y="244" class="item-text">• Compatibilidade universal (Claude, Cursor, Windsurf)</text>
    <text x="24" y="268" class="item-text">• Carregamento pontual apenas quando a ferramenta é útil</text>
  </g>
</svg>