<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#0f172a; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradientes Paleta Google Suavizada -->
    <linearGradient id="grad-monolito" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="grad-legoloop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="node-active" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow-google" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Título do Diagrama -->
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="800" letter-spacing="0.5">PARADIGMA AGÊNTICO: MONÓLITO vs. ESTEIRA MODULAR</text>
  <text x="450" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">Como o fatiamento cirúrgico elimina o inchaço de contexto e as alucinações</text>

  <!-- ==================== LADO ESQUERDO: O MONÓLITO ==================== -->
  <g transform="translate(40, 85)">
    <!-- Caixa do Monólito -->
    <rect x="0" y="0" width="370" height="350" rx="10" fill="url(#grad-monolito)" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 2"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="370" height="42" rx="10" fill="#dc2626" fill-opacity="0.2"/>
    <circle cx="24" cy="21" r="7" fill="#dc2626"/>
    <text x="42" y="26" fill="#fca5a5" font-size="14" font-weight="700">CHAT MONOLÍTICO TRADICIONAL</text>
    <text x="350" y="26" text-anchor="end" fill="#f87171" font-size="11" font-weight="700">~150.000 TOKENS</text>

    <!-- Conteúdo Caótico -->
    <g transform="translate(20, 60)">
      <!-- Camada 1: System Prompt gigante -->
      <rect x="0" y="0" width="330" height="50" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="15" y="22" fill="#e2e8f0" font-size="11" font-weight="600">Catálogo Eager (677 Skills carregadas)</text>
      <text x="15" y="38" fill="#f87171" font-size="10">63.000 tokens despejados antes do "olá"</text>

      <!-- Camada 2: 200 schemas de MCPs -->
      <rect x="0" y="60" width="330" height="50" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="15" y="82" fill="#e2e8f0" font-size="11" font-weight="600">Schemas de MCPs Despejados (REA, Playwright...)</text>
      <text x="15" y="98" fill="#f87171" font-size="10">40.000 tokens de JSON Schema na API</text>

      <!-- Camada 3: Conversa acumulada -->
      <rect x="0" y="120" width="330" height="70" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="15" y="142" fill="#e2e8f0" font-size="11" font-weight="600">Histórico Poluído (50 turnos de tentativa e erro)</text>
      <text x="15" y="158" fill="#94a3b8" font-size="10">Respostas antigas esquecidas • Confusão de contexto</text>
      <text x="15" y="174" fill="#fca5a5" font-size="10" font-weight="700">Atenção da IA diluída (Alucinações frequentes)</text>

      <!-- Badges de Consequência -->
      <g transform="translate(0, 205)">
        <rect x="0" y="0" width="102" height="32" rx="4" fill="#450a0a" stroke="#dc2626"/>
        <text x="51" y="20" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="700">LENTIDÃO</text>

        <rect x="114" y="0" width="102" height="32" rx="4" fill="#450a0a" stroke="#dc2626"/>
        <text x="165" y="20" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="700">CUSTO ALTO</text>

        <rect x="228" y="0" width="102" height="32" rx="4" fill="#450a0a" stroke="#dc2626"/>
        <text x="279" y="20" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="700">TRAVAMENTO</text>
      </g>
    </g>
  </g>

  <!-- ==================== LADO DIREITO: A FÁBRICA LEGOLOOP ==================== -->
  <g transform="translate(490, 85)">
    <!-- Caixa do LegoLoop (Azul Google) -->
    <rect x="0" y="0" width="370" height="350" rx="10" fill="url(#grad-legoloop)" stroke="#2563eb" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="370" height="42" rx="10" fill="#2563eb" fill-opacity="0.25"/>
    <circle cx="24" cy="21" r="7" fill="#60a5fa"/>
    <text x="42" y="26" fill="#bfdbfe" font-size="14" font-weight="700">ESTEIRA MODULAR LEGOLOOP</text>
    <text x="350" y="26" text-anchor="end" fill="#60a5fa" font-size="11" font-weight="700">2.000 A 5.000 TOKENS / BLOCO</text>

    <!-- Nós Cirúrgicos Interligados -->
    <g transform="translate(20, 58)">
      <!-- Bloco 1: Concepção (Azul Google) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="330" height="46" rx="6" fill="#1e293b" stroke="#2563eb" stroke-width="1.2"/>
        <rect x="10" y="10" width="26" height="26" rx="4" fill="#1d4ed8"/>
        <text x="23" y="27" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">01</text>
        <text x="46" y="22" fill="#f8fafc" font-size="11" font-weight="700">Nó 1: Concepção (Entrevista Socrática)</text>
        <text x="46" y="36" fill="#93c5fd" font-size="9.5">Contexto estéril • Produz INTENT.md • Mata a sessão</text>
      </g>

      <!-- Seta 1 -->
      <line x1="165" y1="46" x2="165" y2="58" stroke="#60a5fa" stroke-width="2"/>
      <polygon points="165,64 161,56 169,56" fill="#60a5fa"/>

      <!-- Bloco 2: Especificação (Âmbar Google) -->
      <g transform="translate(0, 64)">
        <rect x="0" y="0" width="330" height="46" rx="6" fill="#1e293b" stroke="#d97706" stroke-width="1.2"/>
        <rect x="10" y="10" width="26" height="26" rx="4" fill="#b45309"/>
        <text x="23" y="27" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">02</text>
        <text x="46" y="22" fill="#f8fafc" font-size="11" font-weight="700">Nó 2: Especificação &amp; Critérios Binários</text>
        <text x="46" y="36" fill="#fcd34d" font-size="9.5">Lê apenas INTENT.md • Produz SPEC.md • Gate Automático</text>
      </g>

      <!-- Seta 2 -->
      <line x1="165" y1="110" x2="165" y2="122" stroke="#60a5fa" stroke-width="2"/>
      <polygon points="165,128 161,120 169,120" fill="#60a5fa"/>

      <!-- Bloco 3: Execução TDD (Verde Google) -->
      <g transform="translate(0, 128)">
        <rect x="0" y="0" width="330" height="46" rx="6" fill="#1e293b" stroke="#16a34a" stroke-width="1.5" filter="url(#glow-google)"/>
        <rect x="0" y="0" width="330" height="46" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.2"/>
        <rect x="10" y="10" width="26" height="26" rx="4" fill="#15803d"/>
        <text x="23" y="27" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">03</text>
        <text x="46" y="22" fill="#f8fafc" font-size="11" font-weight="700">Nó 3: Execução TDD (Red-Green-Refactor)</text>
        <text x="46" y="36" fill="#86efac" font-size="9.5">Zero stubs • Lazy MCP sob demanda • Stop-Gate Humano</text>
      </g>

      <!-- Badges de Vantagem com as Cores do Google -->
      <g transform="translate(0, 207)">
        <rect x="0" y="0" width="102" height="32" rx="4" fill="#1e3a8a" stroke="#2563eb"/>
        <text x="51" y="20" text-anchor="middle" fill="#bfdbfe" font-size="10" font-weight="700">VELOCIDADE</text>

        <rect x="114" y="0" width="102" height="32" rx="4" fill="#14532d" stroke="#16a34a"/>
        <text x="165" y="20" text-anchor="middle" fill="#bbf7d0" font-size="10" font-weight="700">-95% TOKENS</text>

        <rect x="228" y="0" width="102" height="32" rx="4" fill="#78350f" stroke="#d97706"/>
        <text x="279" y="20" text-anchor="middle" fill="#fef3c7" font-size="10" font-weight="700">DETERMINISMO</text>
      </g>
    </g>
  </g>
</svg>
