<?xml version="1.0" encoding="UTF-8"?>
<svg class="diagram-canvas" viewBox="0 0 1040 680" role="img" xmlns="http://www.w3.org/2000/svg" id="variacao_1_camadas-root">
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Sans+TC:wght@400;500;600&amp;display=swap');
      #variacao_1_camadas-root { --paper:        #f5f5f5;
    --paper-card:   #ffffff;
    --paper-subtle: #ececec;
    --ink:          #2d3142;
