    --font-mono:    'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      #variacao_1_camadas-root { font-family: var(--font-sans); color: var(--ink); }
      #variacao_1_camadas-root .page-header { border-bottom: 2px solid var(--accent);
    padding-bottom: 16px;
    margin-bottom: 24px; }
      #variacao_1_camadas-root .page-eyebrow { font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px; }
      #variacao_1_camadas-root .page-title { font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--ink-strong);
    margin-bottom: 8px; }
      #variacao_1_camadas-root .page-desc { font-size: 14px;
