      #legoloop-diagram-design-root .diagram-wrapper::-webkit-scrollbar-thumb:hover, #legoloop-diagram-design-root .table-wrapper::-webkit-scrollbar-thumb:hover { background: rgba(191, 69, 32, 0.5); }
