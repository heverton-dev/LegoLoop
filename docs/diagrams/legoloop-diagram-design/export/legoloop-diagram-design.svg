      <title id="flow-title">Fluxo de Execução do Processo legoloop-diagram-design</title>
      <desc id="flow-desc">Diagrama de fluxo ortogonal de seis nós sequenciais demonstrando o encadeamento do processo de design de diagramas do LegoLoop.</desc>

