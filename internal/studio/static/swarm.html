<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LegoLoop Swarm</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/swarm.css">
  <script src="/ui.js" defer></script>
  <script src="/swarm.js" defer></script>
</head>
<body class="page-swarm">
<header class="topbar swarm-topbar">
  <div class="topbar__left">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name">LegoLoop</span>
    </div>
    <span class="topbar__divider" aria-hidden="true"></span>
    <nav class="topnav" aria-label="Páginas">
      <a class="topnav__link" href="/">Canvas</a>
      <a class="topnav__link" href="/inventario">Inventário</a>
      <a class="topnav__link is-current" href="/swarm" aria-current="page">Swarm</a>
    </nav>
  </div>
  <div class="topbar__actions">
    <div class="meta swarm-summary" id="summary" aria-live="polite">Conectando SSE...</div>
    <span class="topbar__divider" aria-hidden="true"></span>
    <button id="btn-theme-toggle" class="btn btn--sm btn--icon-ctrl" type="button" aria-label="Alternar tema claro e escuro" aria-pressed="false" title="Alternar tema"></button>
  </div>
</header>

<div class="app">
  <div id="swarm-error" class="meta swarm-error" role="alert" aria-live="assertive" hidden></div>
  <div class="swarm-subbar">
    <div class="tabs" id="tabs" role="tablist" aria-label="Processos Swarm"></div>
    <span class="crumb" id="crumb"></span>
  </div>
  <div class="grid">
    <aside class="card card--sidebar" aria-label="Lista de agentes e workers">
      <div class="card-hd">
        <h3>Agentes</h3>
        <div class="row-gap">
          <span class="meta" id="counts"></span>
          <button id="btn-toggle-add-worker" class="btn btn--sm btn--primary" type="button" data-act="toggle-add">+ Worker</button>
        </div>
      </div>
      <div id="add-worker-panel" class="add-worker-panel" hidden></div>
      <div class="scroll" id="workers"></div>
    </aside>
    <section class="card card--main" aria-label="Ficha do agente e quadro de execução">
      <div class="card-hd">
        <h3>Execução <span id="filter"></span></h3>
        <span class="meta">Mais recente no topo</span>
      </div>
      <div id="ficha"></div>
      <div class="scroll" id="msgs"></div>
      <div class="pager" id="pager"></div>
    </section>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</div>
</body>
</html>
