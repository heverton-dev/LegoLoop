<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LegoLoop Studio — Swarm</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/swarm.css">
  <script src="/ui.js" defer></script>
  <script src="/swarm.js" defer></script>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><span class="dot" aria-hidden="true"></span><span>LegoLoop Swarm</span><span class="crumb" id="crumb"></span></div>
    <nav class="topnav" aria-label="Páginas">
      <a class="topnav__link" href="/">Canvas</a>
      <a class="topnav__link" href="/inventario">Inventário</a>
      <a class="topnav__link is-current" href="/swarm" aria-current="page">Swarm</a>
    </nav>
    <div class="hdr-right">
      <div class="meta" id="summary" aria-live="polite">Conectando SSE...</div>
      <button id="btn-theme-toggle" class="btn btn--theme" type="button" aria-label="Alternar tema claro e escuro" aria-pressed="false">Tema: Claro</button>
      <a class="btn link-clean" href="/">← Studio</a>
    </div>
  </div>
  <div id="swarm-error" class="meta" role="alert" aria-live="assertive" hidden></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Processos Swarm"></div>
  <div class="grid">
    <div class="card">
      <div class="card-hd">
        <h3>Agentes</h3>
        <div class="row-gap">
          <span class="meta" id="counts"></span>
          <button id="btn-toggle-add-worker" class="btn" type="button" data-act="toggle-add">+ Worker</button>
        </div>
      </div>
      <div id="add-worker-panel" class="ficha" hidden></div>
      <div class="scroll" id="workers"></div>
    </div>
    <div class="card">
      <div class="card-hd"><h3>Execução <span id="filter"></span></h3><span class="meta">Mais recente no topo</span></div>
      <div id="ficha"></div>
      <div class="scroll" id="msgs"></div>
      <div class="pager" id="pager"></div>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</div>
</body>
</html>
