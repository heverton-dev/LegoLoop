<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LegoLoop • Sessao Interativa A2UI</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/components/sessao.css">
</head>
<body class="a2ui-page sessao-interativa">
  <header class="topbar" role="banner">
    <div class="topbar__left">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">LegoLoop A2UI</span>
      </div>
      <span class="topbar__divider" aria-hidden="true"></span>
      <nav class="topnav" aria-label="Navegação principal">
        <a class="topnav__link" href="/">Canvas</a>
        <a class="topnav__link" href="/processos">Processos</a>
        <a class="topnav__link" href="/inventario">Inventário</a>
      </nav>
    </div>
    <div class="topbar__actions">
      <div id="a2ui-timer-bar" class="a2ui-timer-bar" aria-label="Temporizador da etapa">
        <select id="a2ui-timer-select" class="a2ui-timer-select" title="Tempo limite por etapa">
          <option value="300000" selected>5 min</option>
          <option value="600000">10 min</option>
          <option value="900000">15 min</option>
          <option value="1800000">30 min</option>
        </select>
        <span id="a2ui-timer-display" class="pill a2ui-timer-display" aria-live="off">05:00</span>
        <button id="a2ui-timer-pause" class="btn btn--sm a2ui-timer-btn" type="button" title="Pausar contagem sem encerrar a sessao">Pausar</button>
        <button id="a2ui-timer-extend" class="btn btn--sm a2ui-timer-btn" type="button" title="Adicionar 5 minutos">+5m</button>
      </div>
      <span id="a2ui-process-id" class="pill pill--process">processo</span>
      <span id="a2ui-session-id" class="pill">sessao</span>
      <span id="a2ui-conn-status" class="pill" aria-live="polite">Conectando</span>
      <span class="topbar__divider" aria-hidden="true"></span>
      <button id="btn-theme-toggle" class="btn btn--sm btn--icon-ctrl" type="button" aria-label="Alternar tema claro e escuro" aria-pressed="false" title="Alternar tema"></button>
    </div>
  </header>

  <main class="a2ui-layout">
    <aside class="a2ui-sidebar" aria-label="Arvore de superficies">
      <h1 class="a2ui-sidebar__title">Superficies</h1>
      <div id="a2ui-andon-group" class="a2ui-andon-sidebar"></div>
      <ul id="a2ui-tree" class="a2ui-tree"></ul>
    </aside>

    <section class="a2ui-main" aria-label="Superficie ativa">
      <nav id="a2ui-breadcrumb" class="a2ui-breadcrumb" aria-label="Caminho da superficie"></nav>
      <div id="a2ui-live-progress" class="a2ui-live-progress" hidden></div>
      <div id="a2ui-root" class="a2ui-root"></div>
    </section>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="dialog"></dialog>

  <script src="/ui.js"></script>
  <script type="module" src="/components/sessao-app.js"></script>
</body>
</html>
