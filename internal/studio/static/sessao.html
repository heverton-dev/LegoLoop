<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LegoLoop • Sessao Interativa A2UI</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/components/sessao.css">
</head>
<body class="a2ui-page">
  <header class="stage-topbar" role="banner">
    <div class="stage-topbar__left">
      <strong class="brand">LegoLoop A2UI</strong>
      <nav aria-label="Navegacao principal">
        <a class="btn" href="/">Canvas</a>
        <a class="btn" href="/processos">Processos</a>
        <a class="btn" href="/inventario">Inventario</a>
        <a class="btn" href="/swarm">Swarm</a>
      </nav>
    </div>
    <div class="stage-topbar__right">
      <div id="a2ui-andon-group" class="a2ui-andon-group">
        <button id="btn-andon-cord" class="btn btn--andon" type="button" title="Andon Cord: Parada Emergencial da Esteira">Andon Cord</button>
      </div>
      <span id="a2ui-process-id" class="pill pill--process">processo</span>
      <span id="a2ui-session-id" class="pill">sessao</span>
      <span id="a2ui-conn-status" class="pill" aria-live="polite">Conectando</span>
      <button id="btn-theme-toggle" class="btn btn--sm btn--icon-ctrl" type="button" aria-label="Alternar tema claro e escuro" aria-pressed="false" title="Alternar tema"></button>
    </div>
  </header>

  <main class="a2ui-layout">
    <aside class="a2ui-sidebar" aria-label="Arvore de superficies">
      <h1 class="a2ui-sidebar__title">Superficies</h1>
      <ul id="a2ui-tree" class="a2ui-tree"></ul>
    </aside>

    <section class="a2ui-main" aria-label="Superficie ativa">
      <nav id="a2ui-breadcrumb" class="a2ui-breadcrumb" aria-label="Caminho da superficie"></nav>
      <div id="a2ui-root" class="a2ui-root"></div>
    </section>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="dialog"></dialog>

  <script src="/ui.js"></script>
  <script type="module" src="/components/sessao-app.js"></script>
</body>
</html>
